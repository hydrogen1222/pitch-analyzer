name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      round3_acceptance:
        description: "Run real GAME/MMS-FA acceptance tests (requires model and fixtures)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  round3-acceptance:
    name: Round3 model-backed acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.round3_acceptance == true
    runs-on: windows-latest
    env:
      ROUND3_ACCEPTANCE: "1"
      ROUND3_GAME_MODEL_DIR: ${{ vars.ROUND3_GAME_MODEL_DIR }}
      ROUND3_FA_AUDIO: ${{ vars.ROUND3_FA_AUDIO }}
      ROUND3_E2E_AUDIO: ${{ vars.ROUND3_E2E_AUDIO }}
      ROUND3_E2E_LRC: ${{ vars.ROUND3_E2E_LRC }}
      PITCH_ANALYZER_FA_PYTHON: ${{ vars.PITCH_ANALYZER_FA_PYTHON }}
      PITCH_ANALYZER_FA_HELPER: ${{ vars.PITCH_ANALYZER_FA_HELPER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend/runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio
      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort_extracted
          Move-Item -Path "ort_extracted/onnxruntime-win-x64-1.22.0/lib/onnxruntime.dll" -Destination "src-tauri/resources/onnxruntime.dll"
          Remove-Item -Recurse -Force ort.zip, ort_extracted
      - name: Run ignored Round3 acceptance tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test round3_acceptance -- --ignored --nocapture
